<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Route Estimation</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    #map { height: 500px; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    .input-container { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
    .location-input { flex: 1; min-width: 300px; }
    .results { margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
    button { padding: 8px 16px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
<div class="container">
  <h2>Route Estimation Tool</h2>

  <div class="input-container">
<!--    <div class="location-input">-->
<!--      <h3>Start Point</h3>-->
<!--      <div>-->
<!--        <label>Latitude: <input type="number" id="startLat" step="0.000001" value="10.762622"></label>-->
<!--      </div>-->
<!--      <div>-->
<!--        <label>Longitude: <input type="number" id="startLon" step="0.000001" value="106.660172"></label>-->
<!--      </div>-->
<!--    </div>-->

    <div class="location-input">
      <h3>End Point</h3>
      <div>
        <label>Latitude: <input type="number" id="endLat" step="0.000001" value="10.773813"></label>
      </div>
      <div>
        <label>Longitude: <input type="number" id="endLon" step="0.000001" value="106.704726"></label>
      </div>
    </div>
  </div>

  <button onclick="estimateRoute()">Calculate Route</button>

  <div class="results" id="results">
    <p>Enter coordinates and click "Calculate Route" to see results</p>
  </div>

  <div id="map"></div>
</div>

<script>
  var map = L.map('map').setView([10.762622, 106.660172], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  var startMarker = null;
  var endMarker = null;
  var routeLine = null;

  let currentStartLat = null;
let currentStartLon = null;

  function updateMarkers() {
    const startLat = currentStartLat;
    const startLon = currentStartLon;
    const endLat = parseFloat(document.getElementById('endLat').value);
    const endLon = parseFloat(document.getElementById('endLon').value);

    if (startMarker) map.removeLayer(startMarker);
    if (endMarker) map.removeLayer(endMarker);

    if (startLat !== null && startLon !== null) {
      startMarker = L.marker([startLat, startLon]).addTo(map).bindPopup("Start");
    }
    endMarker = L.marker([endLat, endLon]).addTo(map).bindPopup("End");

    map.fitBounds([
      [startLat, startLon],
      [endLat, endLon]
    ]);
  }

  function estimateRoute() {
  const startLat = currentStartLat;
  const startLon = currentStartLon;
  const endLat = parseFloat(document.getElementById('endLat').value);
  const endLon = parseFloat(document.getElementById('endLon').value);

  if (startLat === null || startLon === null) {
    alert("Start location is not available yet. Please wait for the GPS to initialize.");
    return;
  }

  updateMarkers();

  document.getElementById('results').innerHTML = '<p>Loading route information...</p>';

  fetch(`/api/routing/estimate?startLat=${startLat}&startLon=${startLon}&endLat=${endLat}&endLon=${endLon}`)
    .then(response => {
      if (!response.ok) {
        throw new Error('Network response was not ok');
      }
      return response.json();
    })
    .then(data => {
      // Display results
      document.getElementById('results').innerHTML = `
        <h3>Route Information:</h3>
        <p><strong>Distance:</strong> ${data.distanceKm.toFixed(2)} km</p>
        <p><strong>Estimated Time:</strong> ${data.timeMinutes.toFixed(2)} minutes</p>
      `;

      // Draw the route if geometry is provided
      if (data.routeGeometry) {
        if (routeLine) map.removeLayer(routeLine);

        // Convert GeoJSON to leaflet polyline
        const geojson = JSON.parse(data.routeGeometry);
        const coords = geojson.coordinates.map(coord => [coord[1], coord[0]]);
        routeLine = L.polyline(coords, { color: 'green', weight: 5 }).addTo(map);
      }
    })
    .catch(error => {
      document.getElementById('results').innerHTML = `
        <h3>Error:</h3>
        <p>${error.message}</p>
      `;
    });
}

  function getCurrentLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(position => {
      const { latitude, longitude } = position.coords;
      currentStartLat = latitude;
      currentStartLon = longitude;
      updateMarkers();
    }, error => {
      alert('Error getting location: ' + error.message);
    });

    // Watch position for real-time updates
    navigator.geolocation.watchPosition(position => {
      const { latitude, longitude } = position.coords;
      currentStartLat = latitude;
      currentStartLon = longitude;
      updateMarkers();
    });
  } else {
    alert('Geolocation is not supported by your browser.');
  }
}

  // Initialize the map with markers and get the current location
  getCurrentLocation();
</script>
</body>
</html>
