<!-- Save as driver.html inside /static -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Driver Simulator</title>
</head>
<body>

<h2>Driver Simulator</h2>

<button onclick="sendLocation()">Send Random Location</button>

<script>
  function sendLocation() {
    const driverId = "driver1";
    const latitude = 10.76 + Math.random() * 0.01;   // Random lat
    const longitude = 106.66 + Math.random() * 0.01;  // Random lon

    fetch(`/api/location/update?driverId=${driverId}&latitude=${latitude}&longitude=${longitude}`, {
      method: 'POST'
    })
            .then(response => response.text())
            .then(data => alert(data));
  }
</script>

</body>
</html>
